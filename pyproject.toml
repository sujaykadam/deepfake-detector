[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rppg_detector"
version = "0.1.0"
description = "A learning-project deepfake detector based on remote photoplethysmography (rPPG)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Bounded to the versions this project was developed and tested with
    "opencv-python>=4.8,<6",
    "mediapipe>=0.10.14,<2",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "joblib>=1.3,<2",
    "pandas>=2.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
rppg_detector = "rppg_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88
